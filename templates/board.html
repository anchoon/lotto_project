<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>익명 게시판</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="topbar">
    📢 ANONYMOUS BOARD
</div>

<div class="menu">
    <a href="/">🎰 로또</a>
    <a href="/board">📢 게시판</a>
    <a href="/toto">⚽ 토토</a>
</div>

<div class="board-container">

    <h1 class="board-title">📢 게시판</h1>

    <!-- 게시글 목록 -->
    <div class="posts-area">

        {% for p in posts %}

        <div class="post-card">

            <div class="post-top">

                <div>
                    🥕 {{ p.nickname }}
                </div>

                <div>
                    #{{ p.id }}
                    · {{ p.created_at }}
                    · 👁 {{ p.views }}
                </div>

            </div>

            <div class="post-content">
                {{ p.text }}
            </div>

        </div>

        {% endfor %}

    </div>

    <!-- 글쓰기 -->
    <form method="POST">

        <div class="write-box">

            <textarea
                name="content"
                placeholder="10글자 이상 입력하세요"></textarea>

            <button class="write-btn" type="submit">
                글 작성
            </button>

        </div>

    </form>

</div>

</body>
</html>
