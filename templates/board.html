<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>게시판</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="topbar">📢 ANONYMOUS BOARD</div>

<div class="menu">
    <a href="/">🎰 로또</a>
    <a href="/board">📢 게시판</a>
    <a href="/toto">⚽ 토토</a>
</div>

<div class="board-container">

    <h1 class="board-title">📢 게시판</h1>

    <!-- 🔥 성공 토스트 (중앙 표시) -->
    {% if success %}
    <div class="toast show" onclick="this.remove()">
        ✅ 글 작성 완료
    </div>
    {% endif %}

    <!-- ========================= -->
    <!-- 게시글 목록 (위) -->
    <!-- ========================= -->
    <div class="posts-area">

        {% for p in posts %}
        <div class="post-card">

            <div class="post-top">
                <div>🥕 {{ p.nickname }}</div>
                <div>#{{ p.id }} · 👁 {{ p.views }} · {{ p.created_at }}</div>
            </div>

            <div class="post-content">
                {{ p.text }}
            </div>

        </div>
        {% endfor %}

    </div>

    <!-- ========================= -->
    <!-- 글쓰기 (무조건 하단) -->
    <!-- ========================= -->
    <form method="POST">

        <div class="write-box">

            <textarea name="content" placeholder="10글자 이상 입력"></textarea>

            <button class="write-btn" type="submit">
                작성
            </button>

        </div>

    </form>

    <!-- ========================= -->
    <!-- 페이징 -->
    <!-- ========================= -->
    <div class="paging">

        {% if page > 1 %}
        <a href="/board?page={{ page - 1 }}">이전</a>
        {% endif %}

        {% if has_next %}
        <a href="/board?page={{ page + 1 }}">다음</a>
        {% endif %}

    </div>

</div>

</body>
</html>
